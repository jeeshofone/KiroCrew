name: Windows proxy evidence (PR 34175)

on:
  push:
    branches: [evidence/34175-windows-proxy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PROXY_LOG: ${{ github.workspace }}\proxy-connect.log
    steps:
      - name: Host
        shell: pwsh
        run: |
          Get-ComputerInfo -Property OsName, OsVersion, OsBuildNumber, WindowsVersion | Format-List
          "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"

      - name: Evidence harness
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Upstream source at base
        uses: actions/checkout@v4
        with:
          repository: kirodotdev/KiroCrew
          ref: b6091e46a28c5e8e3b65d71c1e711634d58f95c8
          path: src
          sparse-checkout: |
            src
            pyproject.toml
            README.md
            LICENSE

      - name: Apply the candidate patch
        shell: pwsh
        working-directory: src
        run: |
          git config user.email evidence@example.invalid
          git config user.name evidence
          git apply --include='src/*' ..\harness\tools\evidence\candidate.patch
          git status --short

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        shell: pwsh
        working-directory: src
        run: |
          python -m pip install --disable-pip-version-check -q -e .
          python -c "import sys, slack_sdk, aiohttp; print(sys.version); print('slack_sdk', slack_sdk.version.__version__, 'aiohttp', aiohttp.__version__)"

      - name: Prove no proxy variable is set
        shell: cmd
        run: |
          set HTTP_PROXY=
          set HTTPS_PROXY=
          set NO_PROXY=
          set http_proxy=
          set https_proxy=
          set no_proxy=
          (set | findstr /i proxy) || echo no proxy variables set

      - name: Run the registry cases
        shell: pwsh
        run: |
          Remove-Item Env:HTTP_PROXY, Env:HTTPS_PROXY, Env:NO_PROXY, Env:ALL_PROXY -ErrorAction SilentlyContinue
          python harness\tools\evidence\run_cases.py

  no-proxy-only:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PROXY_LOG: ${{ github.workspace }}/proxy-connect.log
      HEAD_SRC: ${{ github.workspace }}/head
      MAIN_SRC: ${{ github.workspace }}/main
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - name: PR head (14e668368d)
        uses: actions/checkout@v4
        with:
          repository: kirodotdev/KiroCrew
          ref: 14e668368d1a5a51d4ed8d9b98179dd76070f319
          path: head
      - name: Main at the PR base (e21208a2d7)
        uses: actions/checkout@v4
        with:
          repository: kirodotdev/KiroCrew
          ref: e21208a2d73e2cc74510708ea1a7556d43150b3f
          path: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the PR head's dependencies
        working-directory: head
        run: python -m pip install --disable-pip-version-check -q -e .
      - name: NO_PROXY-only case and control, head and main
        run: python harness/tools/evidence/run_no_proxy.py
